[env:micro]
platform = atmelavr
board = micro
framework = arduino
monitor_speed = 9600
monitor_echo = yes
; Give this board its own USB product string so the host can tell the two
; identical Micros apart at enumeration time (same VID:PID, no unique serial).
; The keyboard daemon looks it up via /dev/serial/by-id/usb-Jukebox_Keyboard_*-if00.
board_build.usb_product = Jukebox Keyboard
