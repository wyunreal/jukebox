# Key map for the KeyboardArduino: ACTION=ROW,COL.
#
# This file is the source of truth: install.sh installs it into
# /usr/local/jukebox-keyboard/config.env, so a fresh (or re-installed) box gets
# exactly this map. Edit it here and re-run the installer; do not hand-edit the
# box. A one-off override is possible with --key-action ACTION ROW,COL.
#
# Identify a key's row,col with: sudo .../jukebox-keyboard.py --watch
play=3,3
pause=4,2
stop=3,1
prev=2,3
next=1,4
mute=4,1
openclose=3,2
favourite=2,1
clear=2,2
savequeue=4,3
