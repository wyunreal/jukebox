[Service]
# jukebox-audio: Volumio rewrites /etc/mpd.conf asynchronously and restarts MPD
# before the write finishes, so MPD could read a truncated config (no
# audio_output / no db_file) and come up silent with an empty library. Wait for
# a complete file first. The leading '-' keeps it non-fatal (best effort).
ExecStartPre=-/usr/local/jukebox-audio/wait-mpd-conf.sh
